name: Package EPFO API for Lambda

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, prd]

permissions:
  contents: read
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ACCOUNT_ID: ${{ inputs.environment == 'prd' && vars.AWS_PRD_ACCOUNT_ID || vars.AWS_DEV_ACCOUNT_ID }}
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Configure target-account credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'prd' && secrets.AWS_PRD_DEPLOY_ROLE_ARN || secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: epfo-api-package-${{ inputs.environment }}
      - name: Restore, test, and publish Lambda package
        run: |
          dotnet restore Epfo.Grievance.sln --runtime linux-x64
          dotnet test Epfo.Grievance.sln --no-restore --configuration Release
          rm -rf package
          mkdir -p package/publish
          dotnet publish src/Epfo.Grievance.Api/Epfo.Grievance.Api.csproj --configuration Release --no-restore --runtime linux-x64 --self-contained false --output package/publish
          cd package/publish && zip -r ../lambda.zip .
      - name: Generate OpenAPI document
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ASPNETCORE_ENVIRONMENT: Development
          Jwt__Key: epfo-ci-openapi-generation-key-do-not-use-for-auth
        run: |
          dotnet package/publish/Epfo.Grievance.Api.dll > package/api.log 2>&1 &
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:5080/openapi/v1.json -o package/swagger.json && break; sleep 1; done
          test -s package/swagger.json
          jq '.openapi = "3.0.0" | del(.servers)' package/swagger.json > package/swagger.normalized.json
          mv package/swagger.normalized.json package/swagger.json
          openapi_version="$(jq -r '.openapi // empty' package/swagger.json)"
          if [[ "${openapi_version}" != "3.0.0" ]]; then
            echo "The API Gateway REST API requires an OpenAPI 3.0 document; generated version was '${openapi_version:-missing}'."
            exit 1
          fi
      - name: Upload Lambda and OpenAPI artifacts
        run: |
          LAMBDA_PACKAGE_BUCKET="epfo-${{ inputs.environment }}-lambda-packages-${DEPLOY_ACCOUNT_ID}"
          SWAGGER_BUCKET="$(jq -r '.artifact_bucket_name' "infrastructure/deploy/aws/env/${{ inputs.environment }}/${{ inputs.environment }}.tfvars.json")"
          test -n "${SWAGGER_BUCKET}" && test "${SWAGGER_BUCKET}" != "null"
          aws s3 cp package/lambda.zip "s3://${LAMBDA_PACKAGE_BUCKET}/api/${{ inputs.environment }}/lambda.zip"
          aws s3 cp package/swagger.json "s3://${SWAGGER_BUCKET}/api/${{ inputs.environment }}/swagger.json" --content-type application/json
      - uses: actions/upload-artifact@v4
        with:
          name: epfo-api-${{ inputs.environment }}
          path: |
            package/
