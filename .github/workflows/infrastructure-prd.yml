name: Deploy infrastructure - production

on:
  workflow_dispatch:
    inputs:
      force_migrations:
        description: Run all unrecorded database migrations (requires production approval)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/infrastructure-deploy-template.yml
    with:
      environment: prd
      region: ap-south-1
      apply: true
      force_migrations: ${{ inputs.force_migrations }}
    secrets:
      aws_role_arn: ${{ secrets.AWS_PRD_DEPLOY_ROLE_ARN }}
