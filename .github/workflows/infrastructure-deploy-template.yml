name: Reusable infrastructure deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      region:
        required: true
        type: string
      apply:
        required: false
        default: true
        type: boolean
      force_migrations:
        required: false
        default: false
        type: boolean
    secrets:
      aws_role_arn:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }} infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: epfo-infra-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ inputs.region }}
      DEPLOY_ENV: ${{ inputs.environment }}
      EPFO_GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Detect new database migrations
        id: migration-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_MIGRATIONS: ${{ inputs.force_migrations }}
        run: |
          set -euo pipefail
          new_scripts=""

          if [[ "${FORCE_MIGRATIONS}" == "true" ]]; then
            new_scripts="$(git ls-tree -r --name-only "${HEAD_SHA}" -- 'database/*.sql')"
            echo "Migration execution was explicitly requested."
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
              new_scripts="$(git ls-tree -r --name-only "${HEAD_SHA}" -- 'database/*.sql')"
            else
              modified_scripts="$(git diff --name-only --diff-filter=M "${BEFORE_SHA}" "${HEAD_SHA}" -- 'database/*.sql')"
              if [[ -n "${modified_scripts}" ]]; then
                echo "Existing database migration scripts must not be edited:"
                echo "${modified_scripts}"
                exit 1
              fi
              new_scripts="$(git diff --name-only --diff-filter=A "${BEFORE_SHA}" "${HEAD_SHA}" -- 'database/*.sql')"
            fi
          fi

          if [[ -n "${new_scripts}" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "New database migrations:"
            echo "${new_scripts}"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No new database migration files were added."
          fi
      - name: Read artifact bucket configuration
        id: artifact-bucket
        run: |
          bucket_name="$(jq -r '.artifact_bucket_name' "infrastructure/deploy/aws/env/${DEPLOY_ENV}/${DEPLOY_ENV}.tfvars.json")"
          test -n "${bucket_name}" && test "${bucket_name}" != "null"
          echo "name=${bucket_name}" >> "$GITHUB_OUTPUT"
      - name: Configure target-account credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.region }}
          role-session-name: epfo-infra-${{ inputs.environment }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Terragrunt
        run: |
          curl --fail --location --silent --show-error --output /usr/local/bin/terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.4/terragrunt_linux_amd64
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version
      - name: Deploy VPC and database prerequisites
        if: inputs.apply
        working-directory: infrastructure/deploy/aws
        run: terragrunt run --all --non-interactive --filter '!./static' --filter '!./lambda' --filter '!./migration' --filter '!./apigw' -- apply -auto-approve
      - name: Build .NET Lambda package
        if: inputs.apply
        run: |
          rm -rf package
          mkdir -p package/publish
          dotnet restore Epfo.Grievance.sln --runtime linux-x64
          dotnet test Epfo.Grievance.sln --no-restore --configuration Release
          dotnet publish src/Epfo.Grievance.Api/Epfo.Grievance.Api.csproj --configuration Release --no-restore --runtime linux-x64 --self-contained false --output package/publish
          (cd package/publish && zip -r ../lambda.zip .)
      - name: Generate OpenAPI document
        if: inputs.apply
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ASPNETCORE_ENVIRONMENT: Development
          Jwt__Key: epfo-ci-openapi-generation-key-do-not-use-for-auth
        run: |
          dotnet package/publish/Epfo.Grievance.Api.dll > package/api.log 2>&1 &
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:5080/openapi/v1.json -o package/swagger.json && break; sleep 1; done
          test -s package/swagger.json
      - name: Build database migration package
        if: inputs.apply && steps.migration-files.outputs.should_run == 'true'
        run: |
          mkdir -p package/migration/publish
          dotnet publish src/Epfo.Grievance.Migrations/Epfo.Grievance.Migrations.csproj --configuration Release --no-restore --runtime linux-x64 --self-contained false --output package/migration/publish
          (cd package/migration/publish && zip -r ../migration.zip .)
      - name: Create Lambda package bucket and upload deployment artifacts
        if: inputs.apply
        working-directory: infrastructure/deploy/aws/lambda
        run: |
          terragrunt init --non-interactive
          terragrunt apply --non-interactive -auto-approve \
            --target=aws_s3_bucket.packages \
            --target=aws_s3_bucket_versioning.packages \
            --target=aws_s3_bucket_server_side_encryption_configuration.packages \
            --target=aws_s3_bucket_public_access_block.packages \
            --target=aws_s3_bucket_policy.packages_tls
          LAMBDA_PACKAGE_BUCKET="$(terragrunt output --non-interactive -raw package_bucket_name)"
          aws s3 cp "$GITHUB_WORKSPACE/package/lambda.zip" "s3://${LAMBDA_PACKAGE_BUCKET}/api/${DEPLOY_ENV}/lambda.zip"
          LAMBDA_PACKAGE_VERSION="$(aws s3api head-object --bucket "${LAMBDA_PACKAGE_BUCKET}" --key "api/${DEPLOY_ENV}/lambda.zip" --query VersionId --output text)"
          echo "LAMBDA_PACKAGE_VERSION=${LAMBDA_PACKAGE_VERSION}" >> "$GITHUB_ENV"
          aws s3 cp "$GITHUB_WORKSPACE/package/swagger.json" "s3://${{ steps.artifact-bucket.outputs.name }}/api/${DEPLOY_ENV}/swagger.json" --content-type application/json
          if [[ "${{ steps.migration-files.outputs.should_run }}" == "true" ]]; then
            MIGRATION_S3_KEY="migrations/${DEPLOY_ENV}/${GITHUB_SHA}/migration.zip"
            aws s3 cp "$GITHUB_WORKSPACE/package/migration/migration.zip" "s3://${LAMBDA_PACKAGE_BUCKET}/${MIGRATION_S3_KEY}"
            MIGRATION_S3_OBJECT_VERSION="$(aws s3api head-object --bucket "${LAMBDA_PACKAGE_BUCKET}" --key "${MIGRATION_S3_KEY}" --query VersionId --output text)"
            echo "MIGRATION_S3_KEY=${MIGRATION_S3_KEY}" >> "$GITHUB_ENV"
            echo "MIGRATION_S3_OBJECT_VERSION=${MIGRATION_S3_OBJECT_VERSION}" >> "$GITHUB_ENV"
          fi
      - name: Run database migrations
        if: inputs.apply && steps.migration-files.outputs.should_run == 'true'
        working-directory: infrastructure/deploy/aws/migration
        env:
          RUN_DATABASE_MIGRATIONS: "true"
        run: |
          set -euo pipefail
          cleanup() {
            set +e
            terragrunt destroy --non-interactive -auto-approve
            cleanup_status=$?
            set -e
            return "${cleanup_status}"
          }
          trap 'result=$?; cleanup; cleanup_result=$?; if [[ $result -ne 0 ]]; then exit $result; fi; exit $cleanup_result' EXIT

          terragrunt init --non-interactive
          terragrunt apply --non-interactive -auto-approve
          function_name="$(terragrunt output --non-interactive -raw function_name)"
          invoke_metadata="$(aws lambda invoke --function-name "${function_name}" --cli-binary-format raw-in-base64-out --payload "{\"requestedBy\":\"${GITHUB_REPOSITORY}@${GITHUB_SHA}\"}" migration-response.json --output json)"
          cat migration-response.json
          function_error="$(jq -r '.FunctionError // empty' <<< "${invoke_metadata}")"
          if [[ -n "${function_error}" ]]; then
            echo "Migration Lambda failed: ${function_error}"
            exit 1
          fi
      - name: Plan environment
        working-directory: infrastructure/deploy/aws
        run: terragrunt run --all --non-interactive --filter '!./static' -- plan
      - name: Apply environment
        if: inputs.apply
        working-directory: infrastructure/deploy/aws
        run: terragrunt run --all --non-interactive --filter '!./static' -- apply -auto-approve
